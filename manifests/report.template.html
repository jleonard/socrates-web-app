<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; wide tables scroll in their own frame; accession-style mono IDs.
   Generated by manifests/build-report.mjs from a venue's manifest.json. Edit the template, not the output. */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#1b2026; --muted:#5b6670; --line:#dde1e5; --accent:#2f5d7c;
  --ok:#2e7d4f; --ok-bg:#e5f3ea; --attr:#8a6a12; --attr-bg:#f7efd9; --out:#6b4aa0; --out-bg:#eee8f7;
  --ex:#6b6f74; --ex-bg:#eceef0; --ver:#2f5d7c; --ver-bg:#e3edf4; --code-bg:#eef1f4;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161a; --surface:#1a2026; --fg:#e4e8ec; --muted:#9aa5af; --line:#2c343c; --accent:#8bb8d8;
  --ok:#7fd1a0; --ok-bg:#1b3326; --attr:#e3c46e; --attr-bg:#3a3018; --out:#c3a9ee; --out-bg:#2e2540;
  --ex:#a9aeb3; --ex-bg:#262c32; --ver:#8bb8d8; --ver-bg:#1c2c38; --code-bg:#151a1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161a; --surface:#1a2026; --fg:#e4e8ec; --muted:#9aa5af; --line:#2c343c; --accent:#8bb8d8;
  --ok:#7fd1a0; --ok-bg:#1b3326; --attr:#e3c46e; --attr-bg:#3a3018; --out:#c3a9ee; --out-bg:#2e2540;
  --ex:#a9aeb3; --ex-bg:#262c32; --ver:#8bb8d8; --ver-bg:#1c2c38; --code-bg:#151a1f; color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:48px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
p{margin:0;max-width:68ch}
.lede{color:var(--muted);font-size:16px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.section-head{display:flex;flex-direction:column;gap:6px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
ol.findings{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px;max-width:76ch}
ol.findings li::marker{font-family:var(--mono);color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.id{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-ingest{color:var(--ok);background:var(--ok-bg)}
.s-attrib{color:var(--attr);background:var(--attr-bg)}
.s-outreach{color:var(--out);background:var(--out-bg)}
.s-exclude{color:var(--ex);background:var(--ex-bg)}
.s-verify{color:var(--ver);background:var(--ver-bg)}
.d-none{color:var(--muted);font-size:12px}
.d-approved{color:var(--ok);background:var(--ok-bg)}
.d-rejected{color:var(--ex);background:var(--ex-bg)}
.d-deal{color:var(--out);background:var(--out-bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend div{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--code-bg);color:var(--fg);white-space:nowrap}
.checked{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.card dt{color:var(--muted)}
.card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.priority{font-family:var(--mono);font-size:12px;color:var(--out)}
.copy-entry{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:0 0 8px}
.copy-entry>summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.copy-entry>summary .id{font-weight:400}
.copy-field{padding:0 14px 12px}
.copy-field h4{margin:8px 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.copy-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;line-height:1.55}
.copy-btn{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);cursor:pointer}
.copy-btn:hover{border-color:var(--accent)}
pre.layout{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:76ch}
.rl{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.rl:first-child{border-top:0;padding-top:0}
.rl b{font-weight:600}
@media (max-width:600px){.rl{grid-template-columns:1fr}}
footer{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap" id="app"></div>

<script id="manifest" type="application/json">__MANIFEST__</script>
<script>
const M=JSON.parse(document.getElementById("manifest").textContent);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL={ingest:"Ingest",attrib:"Ingest + attribution",outreach:"Outreach",verify:"Verify",exclude:"Exclude"};
const DEC={approved:"Approved",rejected:"Rejected",deal:"Deal in progress"};
const srcById=Object.fromEntries((M.sources||[]).map(s=>[s.id,s]));
const libById=Object.fromEntries((M.libraries||[]).map(l=>[l.id,l]));
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}catch(_){return d}};
const decision=d=>d?`<span class="pill d-${esc(d)}">${esc(DEC[d]||d)}</span>`:`<span class="d-none">Not reviewed</span>`;
const tags=ids=>`<div class="tags">${(ids||[]).map(i=>`<span class="tag">${esc(i)}</span>`).join("")||'<span class="small">—</span>'}</div>`;
const srcNames=ids=>(ids||[]).map(i=>srcById[i]?srcById[i].name.split(" (")[0].split(",")[0]:i).join("; ");

const counts={};for(const s of M.sources||[])counts[s.status]=(counts[s.status]||0)+1;
const reviewed=(M.sources||[]).filter(s=>s.decision).length;

document.getElementById("app").innerHTML=`
<header>
  <div class="eyebrow">Wonderway · RAG source manifest · ${esc(M.status)} · updated ${esc(fmtDate(M.updated))}</div>
  <h1>${esc(M.place.name)}</h1>
  <p class="lede">Content sources for the ${esc(M.place.name)} guide, sorted by whether we can ingest them as they are, ingest them with attribution, or need a deal first. Everything is staged under <code>${esc(M.place.staging_folder)}</code>, which is never ingested until you rename it.</p>
  <p class="small">${reviewed} of ${(M.sources||[]).length} sources reviewed. Proposed <code>place_id</code>: <code>${esc(M.place.place_id)}</code>. ${esc(M.place.notes||"")}</p>
</header>

<section aria-labelledby="h-glance"><h2 id="h-glance" class="sr">At a glance</h2>
  <div class="stats">${(M.stats||[]).map(s=>`<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("")}</div>
</section>

<section aria-labelledby="h-findings"><div class="section-head"><h2 id="h-findings">What matters for the decision</h2></div>
  <ol class="findings">${(M.findings||[]).map(f=>`<li><strong>${esc(f.title)}</strong> ${esc(f.body)}</li>`).join("")}</ol>
</section>

${(M.decisions||[]).length?`<section aria-labelledby="h-dec"><div class="section-head"><h2 id="h-dec">Decisions made</h2></div>
  <div class="tablebox"><table>
    <thead><tr><th>Date</th><th>Topic</th><th>Decision</th></tr></thead>
    <tbody>${M.decisions.map(d=>`<tr><td class="checked">${esc(fmtDate(d.date))}</td><td><strong>${esc(d.topic)}</strong></td><td>${esc(d.decision)}</td></tr>`).join("")}</tbody>
  </table></div>
</section>`:""}

<section aria-labelledby="h-rooms"><div class="section-head"><h2 id="h-rooms">Rooms and their libraries</h2>
  <p class="small">Each room's <code>libraries.json</code>. At the place level the guide uses every room's libraries plus the venue-wide list: ${tags(M.place_libraries)}</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Room</th><th>${(M.exhibitions||[]).some(e=>e.area)?"Area":"Floor"}</th><th>exhibition_id</th><th>Libraries</th><th>Notes</th></tr></thead>
    <tbody>${(M.exhibitions||[]).map(e=>`<tr><td><strong>${esc(e.name)}</strong><div class="small mono">${esc(e.folder)}</div></td><td class="small">${esc(e.floor??e.area)}${e.area?`<div class="mono">${e.lat!=null?esc(e.lat+", "+e.lng):"no coordinates yet"}</div>`:""}</td><td class="id">${esc(e.id)}</td><td>${tags(e.libraries)}</td><td class="small">${esc(e.notes)}</td></tr>`).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-libs"><div class="section-head"><h2 id="h-libs">Shared libraries</h2>
  <p class="small">Stored once under <code>_library/</code> and reused by any venue that lists them.</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Library</th><th>Covers</th><th>Sources</th><th>Used by rooms</th><th>Reuse</th></tr></thead>
    <tbody>${(M.libraries||[]).map(l=>{const rooms=(M.exhibitions||[]).filter(e=>(e.libraries||[]).includes(l.id)).map(e=>e.name);const venue=(M.place_libraries||[]).includes(l.id);return `<tr><td><strong>${esc(l.name)}</strong><div class="id">${esc(l.id)}</div></td><td class="small">${esc(l.covers)}</td><td class="small">${esc(srcNames(l.sources))}</td><td class="small">${esc([venue?"Whole venue":null,...rooms].filter(Boolean).join(", ")||"Not assigned")}</td><td class="small">${esc(l.reuse)}</td></tr>`}).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-venue"><div class="section-head"><h2 id="h-venue">Venue content</h2><p class="small">About the institution itself. Lives in the place folder, so the guide can use it at every level.</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Folder</th><th>Scope</th><th>What</th><th>Sources</th></tr></thead>
    <tbody>${(M.venue_content||[]).map(v=>`<tr><td class="mono">${esc(v.folder)}</td><td class="small">${esc(v.scope)}</td><td>${esc(v.what)}</td><td class="small">${esc(srcNames(v.sources))}</td></tr>`).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-sources"><div class="section-head"><h2 id="h-sources">Sources</h2>
  <p class="small">A date in "Checked" means I checked the source's own page or API on that day. "Prior knowledge" means it needs confirming before we ingest. Record decisions in <code>manifest.json</code> (<code>"decision": "approved" | "rejected" | "deal"</code>) or tell Claude.</p></div>
  <div class="legend">
    <div><span class="pill s-ingest">Ingest</span> CC0 or public domain</div>
    <div><span class="pill s-attrib">Ingest + attribution</span> CC BY, CC BY-SA, ODC-By</div>
    <div><span class="pill s-outreach">Outreach</span> NC or copyrighted: don't pull, possible deal</div>
    <div><span class="pill s-verify">Verify</span> license unclear or mixed</div>
  </div>
  <div class="chips" role="group" aria-label="Filter sources by status" id="chips"></div>
  <div class="tablebox"><table id="src-table">
    <thead><tr><th>Source</th><th>Status</th><th>License</th><th>Scope</th><th>What it gives</th><th>Access · volume</th><th>Checked</th><th>Decision</th></tr></thead>
    <tbody></tbody>
  </table></div>
</section>

<section aria-labelledby="h-out"><div class="section-head"><h2 id="h-out">Outreach list</h2><p class="small">Nothing here gets ingested. Ranked by how much each would add for this venue.</p></div>
  <div class="cards">${(M.outreach||[]).map((o,i)=>{const s=srcById[o.source]||{};return `<article class="card"><div class="top"><h3>${esc(o.name)}</h3><span class="priority">#${i+1}</span></div><span class="pill s-outreach" style="align-self:flex-start">${esc(s.license||"")}</span><dl><dt>Why</dt><dd>${esc(o.why)}</dd><dt>Ask</dt><dd>${esc(o.ask)}</dd><dt>Contact</dt><dd class="mono">${esc(o.contact)}</dd><dt>Status</dt><dd>${decision(s.decision)}</dd></dl></article>`}).join("")}</div>
</section>

<section aria-labelledby="h-obj"><div class="section-head"><h2 id="h-obj">Sample objects</h2><p class="small">What each source gives some well-known works. Accession numbers are the join key to Wikidata.</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Accession</th><th>Object</th><th>Room</th><th>Usable sources</th><th>Gap</th></tr></thead>
    <tbody>${(M.objects_sample||[]).map(o=>`<tr><td class="id">${esc(o.id)}</td><td><strong>${esc(o.title)}</strong><div class="small">${esc(o.artist)}</div></td><td class="small">${esc(o.room)}</td><td>${esc(o.sources)}</td><td class="small">${esc(o.gap)}</td></tr>`).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-rl"><div class="section-head"><h2 id="h-rl">Rate limits</h2><p class="small">How the content puller treats each host.</p></div>
  <div>${(M.rate_limits||[]).map(r=>`<div class="rl"><b>${esc(r.host)}</b><span>${esc(r.policy)}</span></div>`).join("")}</div>
</section>

<section aria-labelledby="h-layout"><div class="section-head"><h2 id="h-layout">Staging layout in Dropbox</h2><p class="small">Any folder whose name starts with <code>_</code> is never ingested. Renaming it publishes it.</p></div>
  <pre class="layout">${esc(M.staging_layout)}</pre>
</section>

${M.go_live?`<section aria-labelledby="h-live"><div class="section-head"><h2 id="h-live">Go-live checklist</h2><p class="small">${esc(M.go_live.strapi_note)}</p></div>
  <ol class="findings">${(M.go_live.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
  <h3>${M.go_live.rooms_in_dropbox?"Place entry (Strapi) and rooms (Dropbox)":"Strapi entries to create"}</h3>
  <div class="tablebox"><table>
    <thead><tr><th>Type</th><th>ID field</th><th>Name</th><th>Place</th></tr></thead>
    <tbody><tr><td>Place</td><td class="id">place_id: ${esc(M.place.place_id)}</td><td><strong>${esc(M.place.name)}</strong></td><td class="small">—</td></tr>
    ${(M.exhibitions||[]).map(e=>`<tr><td>${M.go_live.rooms_in_dropbox?"Room (Dropbox)":"Exhibition"}</td><td class="id">exhibition_id: ${esc(e.id)}</td><td><strong>${esc(e.name)}</strong><div class="small">${esc(e.floor??e.area)}</div></td><td class="id">${esc(M.place.place_id)}</td></tr>`).join("")}</tbody>
  </table></div>
  ${M.strapi_copy?`<h3>Prompt and greeting for each entry</h3><p class="small">${esc(M.strapi_copy.note)}</p>
  ${[{label:"Place",id:"place_id: "+M.strapi_copy.place.place_id,name:M.strapi_copy.place.name,c:M.strapi_copy.place},...(M.exhibitions||[]).filter(e=>M.strapi_copy.exhibitions[e.id]).map(e=>({label:e.room?"Room "+e.room:"Exhibition",id:"exhibition_id: "+e.id,name:e.name,c:M.strapi_copy.exhibitions[e.id]}))].map(x=>`<details class="copy-entry"><summary><span class="small">${esc(x.label)}</span>${esc(x.name)}<span class="id">${esc(x.id)}</span></summary>
    <div class="copy-field"><h4>Prompt <button type="button" class="copy-btn">Copy</button></h4><p class="copy-text">${esc(x.c.prompt)}</p></div>
    <div class="copy-field"><h4>Greeting <button type="button" class="copy-btn">Copy</button></h4><p class="copy-text">${esc(x.c.greeting)}</p></div>${x.c.card?`
    <div class="copy-field"><h4>Card blurb <button type="button" class="copy-btn">Copy</button></h4><p class="copy-text">${esc(x.c.card.blurb)}</p><p class="small">${x.c.card.image_title?`Card image: ${esc(x.c.card.image_title)} (card.jpg in the room folder)`:"No card image: no public-domain image of a work in this room."}</p></div>`:""}</details>`).join("")}`:""}
  ${(M.go_live.mispronunciations||[]).length?`<h3>Mispronunciations to add to the Place</h3><p class="small">Names speech-to-text is likely to mishear. Add each with its common mishearings after testing.</p>${tags(M.go_live.mispronunciations)}`:""}
</section>`:""}

<section aria-labelledby="h-q"><div class="section-head"><h2 id="h-q">Open questions</h2></div>
  <ul class="plain">${(M.open_questions||[]).map(q=>`<li>${esc(q)}</li>`).join("")}</ul>
</section>

<footer>
  <div>Prepared ${esc(fmtDate(M.prepared))}, updated ${esc(fmtDate(M.updated))}. Generated from <code>manifest.json</code> (manifest version ${esc(M.manifest_version)}).</div>
  <div>These license assessments are a working view, not legal advice.</div>
</footer>`;

const order=["all",...["ingest","attrib","outreach","verify","exclude"].filter(k=>counts[k])];
let cur="all";
try{const v=localStorage.getItem("srcFilter");if(order.includes(v))cur=v}catch(_){}
const chips=document.getElementById("chips");
function renderSources(){
  document.querySelector("#src-table tbody").innerHTML=(M.sources||[]).filter(x=>cur==="all"||x.status===cur).map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="id">${esc(x.id)}</div></td><td><span class="pill s-${esc(x.status)}">${esc(LABEL[x.status]||x.status)}</span></td><td class="small">${esc(x.license)}</td><td class="small">${esc(x.scope)}</td><td>${esc(x.gives)}</td><td class="small">${esc(x.access)}${x.volume&&x.volume!=="—"?` · ${esc(x.volume)}`:""}</td><td class="checked">${esc(x.checked)}</td><td>${decision(x.decision)}</td></tr>`).join("");
  chips.innerHTML=order.map(k=>`<button class="chip" id="chip-${k}" aria-pressed="${k===cur}" data-k="${k}">${k==="all"?"All":LABEL[k]} · ${k==="all"?(M.sources||[]).length:counts[k]}</button>`).join("");
}
chips.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.k;try{localStorage.setItem("srcFilter",cur)}catch(_){}renderSources()});
renderSources();
document.addEventListener("click",ev=>{const b=ev.target.closest(".copy-btn");if(!b)return;const t=b.closest(".copy-field").querySelector(".copy-text").textContent;const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)};try{navigator.clipboard.writeText(t).then(done,()=>{})}catch(e){}});
</script>
