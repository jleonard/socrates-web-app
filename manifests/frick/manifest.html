<style>
/* Layout: one reading column; wide tables scroll in their own frame; accession-style mono IDs.
   Generated by manifests/build-report.mjs from a venue's manifest.json. Edit the template, not the output. */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#1b2026; --muted:#5b6670; --line:#dde1e5; --accent:#2f5d7c;
  --ok:#2e7d4f; --ok-bg:#e5f3ea; --attr:#8a6a12; --attr-bg:#f7efd9; --out:#6b4aa0; --out-bg:#eee8f7;
  --ex:#6b6f74; --ex-bg:#eceef0; --ver:#2f5d7c; --ver-bg:#e3edf4; --code-bg:#eef1f4;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161a; --surface:#1a2026; --fg:#e4e8ec; --muted:#9aa5af; --line:#2c343c; --accent:#8bb8d8;
  --ok:#7fd1a0; --ok-bg:#1b3326; --attr:#e3c46e; --attr-bg:#3a3018; --out:#c3a9ee; --out-bg:#2e2540;
  --ex:#a9aeb3; --ex-bg:#262c32; --ver:#8bb8d8; --ver-bg:#1c2c38; --code-bg:#151a1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161a; --surface:#1a2026; --fg:#e4e8ec; --muted:#9aa5af; --line:#2c343c; --accent:#8bb8d8;
  --ok:#7fd1a0; --ok-bg:#1b3326; --attr:#e3c46e; --attr-bg:#3a3018; --out:#c3a9ee; --out-bg:#2e2540;
  --ex:#a9aeb3; --ex-bg:#262c32; --ver:#8bb8d8; --ver-bg:#1c2c38; --code-bg:#151a1f; color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:48px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
p{margin:0;max-width:68ch}
.lede{color:var(--muted);font-size:16px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.section-head{display:flex;flex-direction:column;gap:6px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
ol.findings{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px;max-width:76ch}
ol.findings li::marker{font-family:var(--mono);color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.id{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-ingest{color:var(--ok);background:var(--ok-bg)}
.s-attrib{color:var(--attr);background:var(--attr-bg)}
.s-outreach{color:var(--out);background:var(--out-bg)}
.s-exclude{color:var(--ex);background:var(--ex-bg)}
.s-verify{color:var(--ver);background:var(--ver-bg)}
.d-none{color:var(--muted);font-size:12px}
.d-approved{color:var(--ok);background:var(--ok-bg)}
.d-rejected{color:var(--ex);background:var(--ex-bg)}
.d-deal{color:var(--out);background:var(--out-bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend div{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--code-bg);color:var(--fg);white-space:nowrap}
.checked{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.card dt{color:var(--muted)}
.card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.priority{font-family:var(--mono);font-size:12px;color:var(--out)}
.copy-entry{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:0 0 8px}
.copy-entry>summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.copy-entry>summary .id{font-weight:400}
.copy-field{padding:0 14px 12px}
.copy-field h4{margin:8px 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.copy-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;line-height:1.55}
.copy-btn{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);cursor:pointer}
.copy-btn:hover{border-color:var(--accent)}
pre.layout{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:76ch}
.rl{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.rl:first-child{border-top:0;padding-top:0}
.rl b{font-weight:600}
@media (max-width:600px){.rl{grid-template-columns:1fr}}
footer{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

t":"Frick's paintings as he catalogued them in 1908, before the museum (historical)","sources":["frick-1908-catalogue"]},{"folder":"about/collection-overview","scope":"venue","what":"One overview doc we write ourselves: rooms, collection areas, standout works","sources":["wikidata"]},{"folder":"_unassigned-objects","scope":"object","what":"Object records not on view (or not matched) as of 2026-11-23; placed objects live in their room folder","sources":["wikidata","wikipedia-en"]}],"sources":[{"id":"wikidata","name":"Wikidata","status":"ingest","license":"CC0","scope":"object, venue","gives":"209 Frick objects: accession numbers, artists, dates, materials, links to Wikipedia. Little decorative arts.","access":"SPARQL endpoint","volume":"209 records","checked":"2026-11-22","decision":null},{"id":"commons","name":"Wikimedia Commons images","status":"ingest","license":"Public domain (PD-Art) for paintings; CC0, CC BY, CC BY-SA photos of 3D objects","scope":"object","gives":"One image per object (Wikidata P18), 1280px, for the ingest's visual descriptions: composition, colors, figures, objects. 150 of 209 objects (141 public domain, 9 CC0/BY/BY-SA). Seven files may show another version or a copy (filenames cite WGA, Washington or \"after\"); four are under 60 KB.","access":"Commons API (license from extmetadata), thumbnails","volume":"150 images, ~75 MB","checked":"2026-11-23","decision":null},{"id":"frick-1908-catalogue","name":"Catalogue of the Henry C. Frick Collection of Paintings (1908)","status":"ingest","license":"Public domain (US)","scope":"venue","gives":"Frick's own catalogue of his paintings before the museum. A companion 1908 exhibition catalogue also exists.","access":"Internet Archive (frick-31072001184441, frick-31072002253625)","volume":"2 volumes","checked":"2026-11-22","decision":null},{"id":"harvey-1928","name":"George Harvey, Henry Clay Frick: The Man (1928)","status":"ingest","license":"Public domain (US)","scope":"venue","gives":"Period biography. atus":"verify","license":"To confirm","scope":"object","gives":"Authoritative records for the Dutch and Flemish paintings.","access":"RKD API","volume":"~30 records","checked":"Not checked","decision":null},{"id":"loc","name":"Library of Congress","status":"verify","license":"Mostly public domain, per item","scope":"universal","gives":"Period photographs and texts for Gilded Age New York.","access":"loc.gov API","volume":"Small","checked":"Prior knowledge","decision":null}],"outreach":[{"source":"frick-site","name":"The Frick Collection","why":"The only source for room texts, decorative arts and the current hang. Also a natural venue partner.","ask":"Licence site and audio-guide text for the guide, or a venue partnership where the Frick supplies content.","contact":"imagerights@frick.org (image rights; ask them to route text licensing)"},{"source":"smarthistory","name":"Smarthistory","why":"Covers several Frick works and nearly every library topic. The same deal would serve the Met.","ask":"Commercial licence for text in a paid audio guide, with attribution.","contact":"smarthistory.org/contact-us"},{"source":"essential-vermeer","name":"Essential Vermeer","why":"The Vermeers are the Frick's best-known works.","ask":"Permission to use the Frick Vermeer entries.","contact":"essentialvermeer.com"},{"source":"wga","name":"Web Gallery of Art","why":"Low priority: Wikipedia already covers the best-known paintings.","ask":"Only if painting answers come out thin.","contact":"wga.hu"}],"objects_sample":[{"id":"1919.1.126","title":"Mistress and Maid","artist":"Johannes Vermeer","room":"West Gallery (Room 13)","sources":"Wikidata; Wikipedia (en, es); Hofstede de Groot","gap":"Frick text (outreach)"},{"id":"1911.1.127","title":"Officer and Laughing Girl","artist":"Johannes Vermeer","room":"Anteroom (Room 5)","sources":"Wikidata; Wikipedia (en, es); Hofstede de Groot","gap":"Frick text (outreach)"},{"id":"1912.1.77","title":"Portrait of Sir Thomas More","artist":"Hans Holbein the Younger","room":"Living Hall (Room 10)","sources":"Wikidata; Wikipedia (en, es)","gap":"None significant"},{"id":"1915.1.03","title":"Saint Francis in the Desert","artist":"Giovanni Bellini","room":"Living Hall (Room 10)","sources":"Wikidata; Wikipedia (en, es); Vasari on Bellini","gap":"None significant"},{"id":"1910.1.98","title":"The Polish Rider","artist":"Rembrandt","room":"West Gallery (Room 13)","sources":"Wikidata; Wikipedia (en, es)","gap":"None significant"},{"id":"1927.1.81","title":"Comtesse d'Haussonville","artist":"Jean-Auguste-Dominique Ingres","room":"Walnut Room (Room 25)","sources":"Wikidata; Wikipedia (en, es)","gap":"None significant"},{"id":"1915.1.46","title":"The Progress of Love: The Meeting","artist":"Jean-Honoré Fragonard","room":"Fragonard Room (Room 9)","sources":"Wikidata; French Rococo library","gap":"No Wikipedia article for the panels"},{"id":"1950.1.159","title":"The Flagellation of Christ","artist":"Cimabue","room":"Gold-Grounds Room (Room 26)","sources":"Wikidata; Wikipedia (en); Vasari on Cimabue","gap":"None significant"},{"id":"—","title":"Du Paquier porcelain, medals, clocks","artist":"various","room":"Medals, Ceramics, Du Paquier, Clocks and Watches rooms","sources":"Libraries only","gap":"No object records: needs Frick data or a deal"}],"rate_limits":[{"host":"Wikipedia (Action and REST APIs)","policy":"One request at a time, at most 1 per second. Action API calls send maxlag=5. On 429 or 503, wait for Retry-After, otherwise back off exponentially (2s, 4s, 8s… up to 5 minutes). First check up to 50 titles' current revision IDs per call, then fetch only pages whose revision changed. User-Agent: ResearchBot/0.1 (leonardalonsostudio@gmail.com)."},{"host":"Wikidata SPARQL","policy":"One query at a time, at least 2 seconds apart. Keep each query small (one per venue), because the service limits total query time per minute. Cache results."},{"host":"collections.frick.org","policy":"robots.txt Crawl-delay 30: one request every 31 seconds. Only on-view listing pages and object pages (for accession numbers); media and search paths are disallowed and never fetched. Pages cached locally."},{"host":"Internet Archive","policy":"At most 1 request per second. Download each book's full text once (the _djvu.txt file) and cache it. Never re-download unchanged items."},{"host":"Art Institute of Chicago API","policy":"Stay under its published anonymous limit (60 requests per minute): 1 request per second."},{"host":"Getty vocabularies","policy":"Use the bulk downloads, not per-term requests."},{"host":"Project Gutenberg","policy":"Download from a mirror once and cache. Never crawl gutenberg.org pages."},{"host":"All sources","policy":"Raw responses go into a local cache (gitignored .tmp/source-cache/, keyed by URL and revision), so re-running the puller repeats no network calls. Runs are resumable: a rate-limited run stops cleanly and the next run continues from the cache."}],"staging_layout":"/wonderway rag/places/_frick/\n  _review/manifest.json, manifest.html, placements.json   ← this report\n  metadata.json                          {\"place_id\":\"frick-nyc\",\"place_name\":\"The Frick Collection\"}\n  libraries.json                         {\"libraries\":[\"lib-gilded-age-new-york\",\"lib-artists\"]}\n  about/\n    history/   frick-1908-catalogue/   harvey-1928/   collection-overview/\n  objects/                               ← on view outside any room (place level)\n  exhibitions/\n    west-gallery/    metadata.json  libraries.json  \u003cobject>/  (wikidata.md, wikipedia, vision/)\n    living-hall/ …   lajoue-passage/ …   (35 rooms)\n  _unassigned-objects/                   ← objects not on view as of the last check\n/wonderway rag/_library/\n  artists/\u003cartist>/  dutch-golden-age-painting/ wikipedia/ …\n\nTo go live: rename _frick → frick and _library → library.","decisions":[{"date":"2026-11-23","topic":"place_id","decision":"frick-nyc."},{"date":"2026-11-23","topic":"Strapi entries","decision":"You create them at go-live from the checklist. Strapi stays the only writer of location_relationships."},{"date":"2026-11-25","topic":"Room assignment","decision":"One exhibition per numbered room on the Frick floor plan (34) plus the Lauder galleries. Rooms come from the on-view listings at collections.frick.org (crawled at its 30-second crawl delay): 156 objects placed, 56 confirmed by accession number and 100 by exact title and artist. placements.json records the evidence; the puller writes placed objects into their room folder and leaves the other 53 in _unassigned-objects/. Only room names are used from the site, no text or images."},{"date":"2026-11-23","topic":"Wikipedia User-Agent","decision":"ResearchBot/0.1 (leonardalonsostudio@gmail.com)."},{"date":"2026-11-23","topic":"Henry Clay Frick's labor history","decision":"Be transparent. Whenever the guide talks about Frick's life or fortune, it includes the 1892 Homestead Strike and the South Fork club / Johnstown Flood, stated factually from sourced text, not left out or softened. Harvey's 1928 biography is tagged historical and framed as a period view."},{"date":"2026-11-23","topic":"Artist biographies","decision":"Shared library lib-artists: one folder per artist credited on a collection object (103 for the Frick). Wikidata facts for all, the English Wikipedia biography unless a topic library already has it, Getty ULAN where Wikipedia has none or only a stub. The Frick subscribes at place level."},{"date":"2026-11-23","topic":"Artwork images","decision":"Commons images only, license checked per file (PD, CC0, CC BY, CC BY-SA); each goes in \u003cobject>/vision/ with its license and attribution in metadata.json, and paintings get the ingest's artwork prompt. The Frick's own images are not crawled (robots.txt disallows them; site terms are non-commercial): ask for them in the Frick outreach, which would also cover the 59 objects without a Commons image."},{"date":"2026-11-25","topic":"Moroni, Portrait of a Young Woman","decision":"Left in _unassigned-objects/: Wikidata has no accession number for it, so its room (probably the South Hall) could not be confirmed."},{"date":"2026-11-23","topic":"Spanish Wikipedia","decision":"Skipped. English sources only. The guide answers in the visitor's language."}],"open_questions":["Walnut Room: your walnut-room/about.md calls it Frick's bedroom, where he died; Wikipedia calls the Walnut Room the sitting room next to his bedroom (and the Frick also lists a separate Sitting Room, Room 24). The draft prompt leaves this out until it's confirmed."],"strapi_copy":{"note":"Draft copy for Strapi. prompt = venue context the guide reads as a source (place prompt + room prompt both apply in a room). greeting = spoken by TTS when the visitor opens that place or room; written in English, other languages are LLM-translated. Facts come from staged Wikipedia/Wikidata text and the Frick on-view room list (Nov 2026). Hours and tickets are left out on purpose: they change.","place":{"place_id":"frick-nyc","name":"The Frick Collection","prompt":"The visitor is at The Frick Collection, in Henry Clay Frick's former house at 1 East 70th Street, on Fifth Avenue between 70th and 71st Streets in New York City. Thomas Hastings of Carrère and Hastings designed the house, completed in 1914, as Frick's home, and Frick intended it to become a public museum for his art collection. Frick died in the house on December 2, 1919. After his wife Adelaide died in 1931, John Russell Pope converted the house into a museum, which opened on December 16, 1935. The house closed for renovation from 2020 to 2025 (the collection was shown at Frick Madison, 945 Madison Avenue, from 2021 to 2024) and reopened on April 17, 2025, with an addition designed by Annabelle Selldorf.\n\nThe collection is best known for European paintings from the Renaissance to the 19th century, including works by Vermeer, Rembrandt, Holbein, Bellini, Titian, El Greco, Velázquez, Goya, Fragonard, Gainsborough and Turner, shown in the rooms of the house alongside sculpture, furniture, porcelain, enamels, portrait medals, and clocks and watches.\n\nThe first floor held the family's shared rooms and the second floor their bedrooms and private rooms; both are now galleries. First floor: Entrance Hall (Room 1), East Vestibule (3), Octagon Room (4), Anteroom (5), Cabinet (6), Dining Room (7), West Vestibule (8), Fragonard Room (9), Living Hall (10), Library (11), Portico Gallery (12), West Gallery (13), Enamels Room (14), Oval Room (15), East Gallery (16), Garden Court (17), North Hall (18), South Hall (19), Foot of Stairs and Landing (20), and the Ronald S. Lauder Exhibition Galleries for special exhibitions. Second floor: Grand Stair Hall (21), Long Hall (22), Medals Room (23), Sitting Room (24), Walnut Room (25), Gold-Grounds Room (26), Ceramics Room (27), Boucher Anteroom (28), Boucher Room (29), Du Paquier Passage (30), Small Hallway (31), Impressionist Room (32), Clocks and Watches Room (33), Breakfast Room (34) and Lajoue Passage (35). The Frick Art Research Library, founded by Helen Clay Frick in 1920, is part of the institution.\n\nHenry Clay Frick (1849–1919) made his fortune in coke and steel. His career includes the violent 1892 Homestead Strike at Carnegie Steel, and he was a founding member of the South Fork Fishing and Hunting Club, whose dam failed in 1889, causing the Johnstown Flood.","greeting":"Hi, I'm Wonder! Welcome to the Frick Collection. I can tell you about any painting or room in Henry Clay Frick's house, from Vermeer and Rembrandt downstairs to the porcelain and clocks upstairs. Try it in your own language, and press talk whenever you're ready."},"exhibitions":{"frick-entrance-hall":{"name":"Entrance Hall","room":1,"prompt":"The visitor is in the Entrance Hall (Room 1) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. One object is on view in this room.","greeting":"Welcome to the Entrance Hall! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-east-vestibule":{"name":"East Vestibule","room":3,"prompt":"The visitor is in the East Vestibule (Room 3) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Works on view here include Adoration of the Magi by Lazzaro Bastiani; Perseus and Andromeda by Giovanni Battista Tiepolo. About 4 objects are on view in this room. Topics for this room: Chinese porcelain, Venetian painting.","greeting":"Welcome to the East Vestibule! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-octagon-room":{"name":"Octagon Room","room":4,"prompt":"The visitor is in the Octagon Room (Room 4) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Works on view here include Bust of a Lady by Francesco Laurana. About 2 objects are on view in this room. Topics for this room: Renaissance sculpture and bronzes.","greeting":"Welcome to the Octagon Room! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-anteroom":{"name":"Anteroom","room":5,"prompt":"The visitor is in the Anteroom (Room 5) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Works on view here include Christ Driving the Money Changers from the Temple by El Greco; Officer and Laughing Girl by Johannes Vermeer. About 9 objects are on view in this room. Topics for this room: Spanish painting, Dutch Golden Age painting.","greeting":"Welcome to the Anteroom! I'm Wonder. Ask me about anything you see here, like Vermeer's Officer and Laughing Girl. Press talk when you're ready."},"frick-cabinet":{"name":"Cabinet","room":6,"prompt":"The visitor is in the Cabinet (Room 6) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The Cabinet holds rotating displays; ask about the current one. About 6 objects are on view in this room.","greeting":"Welcome to the Cabinet! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-dining-room":{"name":"Dining Room","room":7,"prompt":"The visitor is in the Dining Room (Room 7) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Works on view here include The Mall in St. James's Park by Thomas Gainsborough; Grace Dalrymple Elliott by Thomas Gainsborough; Henrietta, Countess of Warwick, and Her Children by George Romney; Mrs. Peter William Baker by Thomas Gainsborough; Richard Paul Jodrell by Thomas Gainsborough; The Hon. Frances Duncombe by Thomas Gainsborough; The Ladies Sarah and Catherine Bligh by John Hoppner. About 19 objects are on view in this room. Topics for this room: British portraiture, European porcelain and faience.","greeting":"Welcome to the Dining Room! I'm Wonder. Ask me about anything you see here, like Gainsborough's The Mall in St. James's Park. Press talk when you're ready."},"frick-west-vestibule":{"name":"West Vestibule","room":8,"prompt":"The visitor is in the West Vestibule (Room 8) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Works on view here include The Four Seasons: Autumn by François Boucher; The Four Seasons: Spring by François Boucher; The Four Seasons: Summer by François Boucher; The Four Seasons: Winter by François Boucher. About 8 objects are on view in this room. Topics for this room: French Rococo, French 18th-century furniture, Chinese porcelain.","greeting":"Welcome to the West Vestibule! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-fragonard-room":{"name":"Fragonard Room","room":9,"prompt":"The visitor is in the Fragonard Room (Room 9) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The room is named for Jean-Honoré Fragonard's series The Progress of Love, panels originally painted for Madame du Barry; Frick had the room finished in 1916 to show them. Works on view here include The Lover Crowned by Jean-Honoré Fragonard; The Progress of Love: Love Letters by Jean-Honoré Fragonard; The Progress of Love: Reverie by Jean-Honoré Fragonard; The Progress of Love: The Meeting by Jean-Honoré Fragonard; The Progress of Love: The Pursuit by Jean-Honoré Fragonard; The Progress of Love: Hollyhocks by Jean-Honoré Fragonard; The Progress of Love: Hollyhocks by Jean-Honoré Fragonard; The Progress of Love: Hollyhocks by Jean-Honoré Fragonard; The Progress of Love: Hollyhocks by Jean-Honoré Fragonard; The Progress of Love: Love Pursuing a Dove by Jean-Honoré Fragonard; The Progress of Love: Love Triumphant by Jean-Honoré Fragonard; The Progress of Love: Love the Avenger by Jean-Honoré Fragonard; The Progress of Love: Love the Jester by Jean-Honoré Fragonard; The Progress of Love: Love the Sentinel by Jean-Honoré Fragonard. About 39 objects are on view in this room. Topics for this room: French Rococo, French 18th-century furniture, European porcelain and faience.","greeting":"Welcome to the Fragonard Room! I'm Wonder. Ask me about anything you see here, like Fragonard's Progress of Love panels. Press talk when you're ready."},"frick-living-hall":{"name":"Living Hall","room":10,"prompt":"The visitor is in the Living Hall (Room 10) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Works on view here include Portrait of Sir Thomas More by Hans Holbein the Younger; Portrait of a Man in a Red Cap by Titian; Saint Francis in the Desert by Giovanni Bellini; Thomas Cromwell by Hans Holbein the Younger; Portrait of Pietro Aretino by Titian; St. Jerome by El Greco. About 44 objects are on view in this room. Topics for this room: Northern Renaissance painting, Venetian painting, Spanish painting, Renaissance sculpture and bronzes, Chinese porcelain.","greeting":"Welcome to the Living Hall! I'm Wonder. Ask me about anything you see here, like Holbein's portrait of Sir Thomas More. Press talk when you're ready."},"frick-library-room":{"name":"Library","room":11,"prompt":"The visitor is in the Library (Room 11) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. This is the library room of the house, not the Frick Art Research Library. Works on view here include Julia, Lady Peel by Thomas Lawrence; Mortlake Terrace: Early Summer Morning by J. M. W. Turner; Fishing Boats Entering Calais Harbor by J. M. W. Turner; Elizabeth, Lady Taylor by Joshua Reynolds; Mrs. Charles Hatchett by Thomas Gainsborough; Salisbury Cathedral from the Bishop's Garden by John Constable; Sarah, Lady Innes by Thomas Gainsborough; Selina, Lady Skipwith by Joshua Reynolds; Henry Clay Frick by John Christen Johansen; James Cruikshank by Henry Raeburn; Mrs. James Cruikshank by Henry Raeburn. About 41 objects are on view in this room. Topics for this room: British portraiture.","greeting":"Welcome to the Library! I'm Wonder. Ask me about anything you see here, like Turner's Mortlake Terrace. Press talk when you're ready."},"frick-portico-gallery":{"name":"Portico Gallery","room":12,"prompt":"The visitor is in the Portico Gallery (Room 12) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Most of the objects here are Meissen porcelain. About 92 objects are on view in this room. Topics for this room: European porcelain and faience.","greeting":"Welcome to the Portico Gallery! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-west-gallery":{"name":"West Gallery","room":13,"prompt":"The visitor is in the West Gallery (Room 13) on the first floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. Works on view he :"The visitor is in the Du Paquier Passage (Room 30) on the second floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The second floor held the Frick family's bedrooms and private rooms. Most of the objects here are Du Paquier porcelain from Vienna. About 14 objects are on view in this room. Topics for this room: European porcelain and faience.","greeting":"Welcome to the Du Paquier Passage! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-small-hallway":{"name":"Small Hallway","room":31,"prompt":"The visitor is in the Small Hallway (Room 31) on the second floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The second floor held the Frick family's bedrooms and private rooms. Works on view here include The Portal of Valenciennes by Jean-Antoine Watteau; Motherhood by Eugène Carrière. About 5 objects are on view in this room. Topics for this room: British landscape painting, French Rococo.","greeting":"Welcome to the Small Hallway! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-impressionist-room":{"name":"Impressionist Room","room":32,"prompt":"The visitor is in the Impressionist Room (Room 32) on the second floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The second floor held the Frick family's bedrooms and private rooms. Works on view here include The Bullfight by Édouard Manet; The Arch of Constantine and the Forum by Jean-Baptiste Camille Corot; The Rehearsal by Edgar Degas; Vétheuil in Winter by Claude Monet. About 6 objects are on view in this room. Topics for this room: French 19th-century painting.","greeting":"Welcome to the Impressionist Room! I'm Wonder. Ask me about anything you see here, like Manet's The Bullfight. Press talk when you're ready."},"frick-clocks-and-watches-room":{"name":"Clocks and Watches Room","room":33,"prompt":"The visitor is in the Clocks and Watches Room (Room 33) on the second floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The second floor held the Frick family's bedrooms and private rooms. This room displays clocks and watches. Works on view here include Grapes with Insects on a Marble Top by Gerard van Spaendonck. About 28 objects are on view in this room. Topics for this room: Clocks and watches.","greeting":"Welcome to the Clocks and Watches Room! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-breakfast-room":{"name":"Breakfast Room","room":34,"prompt":"The visitor is in the Breakfast Room (Room 34) on the second floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The second floor held the Frick family's bedrooms and private rooms. The Breakfast Room was decorated by Charles Allom. Works on view here include Dieppe by Charles-François Daubigny; The Boatman of Mortefontaine by Jean-Baptiste Camille Corot; The Pond by Jean-Baptiste Camille Corot; The River by Jules Dupré; The Washerwomen by Charles-François Daubigny; Ville-d'Avray by Jean-Baptiste Camille Corot; Woman Sewing by Lamplight by Jean-François Millet; A Pasture in Normandy by Constant Troyon; The Village of Becquigny by Théodore Rousseau. About 16 objects are on view in this room. Topics for this room: Barbizon school.","greeting":"Welcome to the Breakfast Room! I'm Wonder. Ask me about anything you see here. Press talk when you're ready."},"frick-lajoue-passage":{"name":"Lajoue Passage","room":35,"prompt":"The visitor is in the Lajoue Passage (Room 35) on the second floor of The Frick Collection, Henry Clay Frick's former house on Fifth Avenue in New York City. The second floor held the Frick family's bedrooms and private rooms. Works on view here include Seven Decorative Panels Mounted in a Screen: Girl with Cupid by Jacques de Lajoue; Seven Decorative Panels Mounted in a Screen: G <script>
const M=JSON.parse(document.getElementById("manifest").textContent);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL={ingest:"Ingest",attrib:"Ingest + attribution",outreach:"Outreach",verify:"Verify",exclude:"Exclude"};
const DEC={approved:"Approved",rejected:"Rejected",deal:"Deal in progress"};
const srcById=Object.fromEntries((M.sources||[]).map(s=>[s.id,s]));
const libById=Object.fromEntries((M.libraries||[]).map(l=>[l.id,l]));
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}catch(_){return d}};
const decision=d=>d?`<span class="pill d-${esc(d)}">${esc(DEC[d]||d)}</span>`:`<span class="d-none">Not reviewed</span>`;
const tags=ids=>`<div class="tags">${(ids||[]).map(i=>`<span class="tag">${esc(i)}</span>`).join("")||'<span class="small">—</span>'}</div>`;
const srcNames=ids=>(ids||[]).map(i=>srcById[i]?srcById[i].name.split(" (")[0].split(",")[0]:i).join("; ");

const counts={};for(const s of M.sources||[])counts[s.status]=(counts[s.status]||0)+1;
const reviewed=(M.sources||[]).filter(s=>s.decision).length;

document.getElementById("app").innerHTML=`
<header>
  <div class="eyebrow">Wonderway · RAG source manifest · ${esc(M.status)} · updated ${esc(fmtDate(M.updated))}</div>
  <h1>${esc(M.place.name)}</h1>
  <p class="lede">Content sources for the ${esc(M.place.name)} guide, sorted by whether we can ingest them as they are, ingest them with attribution, or need a deal first. Everything is staged under <code>${esc(M.place.staging_folder)}</code>, which is never ingested until you rename it.</p>
  <p class="small">${reviewed} of ${(M.sources||[]).length} sources reviewed. Proposed <code>place_id</code>: <code>${esc(M.place.place_id)}</code>. ${esc(M.place.notes||"")}</p>
</header>

<section aria-labelledby="h-glance"><h2 id="h-glance" class="sr">At a glance</h2>
  <div class="stats">${(M.stats||[]).map(s=>`<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("")}</div>
</section>

<section aria-labelledby="h-findings"><div class="section-head"><h2 id="h-findings">What matters for the decision</h2></div>
  <ol class="findings">${(M.findings||[]).map(f=>`<li><strong>${esc(f.title)}</strong> ${esc(f.body)}</li>`).join("")}</ol>
</section>

${(M.decisions||[]).length?`<section aria-labelledby="h-dec"><div class="section-head"><h2 id="h-dec">Decisions made</h2></div>
  <div class="tablebox"><table>
    <thead><tr><th>Date</th><th>Topic</th><th>Decision</th></tr></thead>
    <tbody>${M.decisions.map(d=>`<tr><td class="checked">${esc(fmtDate(d.date))}</td><td><strong>${esc(d.topic)}</strong></td><td>${esc(d.decision)}</td></tr>`).join("")}</tbody>
  </table></div>
</section>`:""}

<section aria-labelledby="h-rooms"><div class="section-head"><h2 id="h-rooms">Rooms and their libraries</h2>
  <p class="small">Each room's <code>libraries.json</code>. At the place level the guide uses every room's libraries plus the venue-wide list: ${tags(M.place_libraries)}</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Room</th><th>Floor</th><th>exhibition_id</th><th>Libraries</th><th>Notes</th></tr></thead>
    <tbody>${(M.exhibitions||[]).map(e=>`<tr><td><strong>${esc(e.name)}</strong><div class="small mono">${esc(e.folder)}</div></td><td class="small">${esc(e.floor)}</td><td class="id">${esc(e.id)}</td><td>${tags(e.libraries)}</td><td class="small">${esc(e.notes)}</td></tr>`).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-libs"><div class="section-head"><h2 id="h-libs">Shared libraries</h2>
  <p class="small">Stored once under <code>_library/</code> and reused by any venue that lists them.</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Library</th><th>Covers</th><th>Sources</th><th>Used by rooms</th><th>Reuse</th></tr></thead>
    <tbody>${(M.libraries||[]).map(l=>{const rooms=(M.exhibitions||[]).filter(e=>(e.libraries||[]).includes(l.id)).map(e=>e.name);const venue=(M.place_libraries||[]).includes(l.id);return `<tr><td><strong>${esc(l.name)}</strong><div class="id">${esc(l.id)}</div></td><td class="small">${esc(l.covers)}</td><td class="small">${esc(srcNames(l.sources))}</td><td class="small">${esc([venue?"Whole venue":null,...rooms].filter(Boolean).join(", ")||"Not assigned")}</td><td class="small">${esc(l.reuse)}</td></tr>`}).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-venue"><div class="section-head"><h2 id="h-venue">Venue content</h2><p class="small">About the institution itself. Lives in the place folder, so the guide can use it at every level.</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Folder</th><th>Scope</th><th>What</th><th>Sources</th></tr></thead>
    <tbody>${(M.venue_content||[]).map(v=>`<tr><td class="mono">${esc(v.folder)}</td><td class="small">${esc(v.scope)}</td><td>${esc(v.what)}</td><td class="small">${esc(srcNames(v.sources))}</td></tr>`).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-sources"><div class="section-head"><h2 id="h-sources">Sources</h2>
  <p class="small">A date in "Checked" means I checked the source's own page or API on that day. "Prior knowledge" means it needs confirming before we ingest. Record decisions in <code>manifest.json</code> (<code>"decision": "approved" | "rejected" | "deal"</code>) or tell Claude.</p></div>
  <div class="legend">
    <div><span class="pill s-ingest">Ingest</span> CC0 or public domain</div>
    <div><span class="pill s-attrib">Ingest + attribution</span> CC BY, CC BY-SA, ODC-By</div>
    <div><span class="pill s-outreach">Outreach</span> NC or copyrighted: don't pull, possible deal</div>
    <div><span class="pill s-verify">Verify</span> license unclear or mixed</div>
  </div>
  <div class="chips" role="group" aria-label="Filter sources by status" id="chips"></div>
  <div class="tablebox"><table id="src-table">
    <thead><tr><th>Source</th><th>Status</th><th>License</th><th>Scope</th><th>What it gives</th><th>Access · volume</th><th>Checked</th><th>Decision</th></tr></thead>
    <tbody></tbody>
  </table></div>
</section>

<section aria-labelledby="h-out"><div class="section-head"><h2 id="h-out">Outreach list</h2><p class="small">Nothing here gets ingested. Ranked by how much each would add for this venue.</p></div>
  <div class="cards">${(M.outreach||[]).map((o,i)=>{const s=srcById[o.source]||{};return `<article class="card"><div class="top"><h3>${esc(o.name)}</h3><span class="priority">#${i+1}</span></div><span class="pill s-outreach" style="align-self:flex-start">${esc(s.license||"")}</span><dl><dt>Why</dt><dd>${esc(o.why)}</dd><dt>Ask</dt><dd>${esc(o.ask)}</dd><dt>Contact</dt><dd class="mono">${esc(o.contact)}</dd><dt>Status</dt><dd>${decision(s.decision)}</dd></dl></article>`}).join("")}</div>
</section>

<section aria-labelledby="h-obj"><div class="section-head"><h2 id="h-obj">Sample objects</h2><p class="small">What each source gives some well-known works. Accession numbers are the join key to Wikidata.</p></div>
  <div class="tablebox"><table>
    <thead><tr><th>Accession</th><th>Object</th><th>Room</th><th>Usable sources</th><th>Gap</th></tr></thead>
    <tbody>${(M.objects_sample||[]).map(o=>`<tr><td class="id">${esc(o.id)}</td><td><strong>${esc(o.title)}</strong><div class="small">${esc(o.artist)}</div></td><td class="small">${esc(o.room)}</td><td>${esc(o.sources)}</td><td class="small">${esc(o.gap)}</td></tr>`).join("")}</tbody>
  </table></div>
</section>

<section aria-labelledby="h-rl"><div class="section-head"><h2 id="h-rl">Rate limits</h2><p class="small">How the content puller treats each host.</p></div>
  <div>${(M.rate_limits||[]).map(r=>`<div class="rl"><b>${esc(r.host)}</b><span>${esc(r.policy)}</span></div>`).join("")}</div>
</section>

<section aria-labelledby="h-layout"><div class="section-head"><h2 id="h-layout">Staging layout in Dropbox</h2><p class="small">Any folder whose name starts with <code>_</code> is never ingested. Renaming it publishes it.</p></div>
  <pre class="layout">${esc(M.staging_layout)}</pre>
</section>

${M.go_live?`<section aria-labelledby="h-live"><div class="section-head"><h2 id="h-live">Go-live checklist</h2><p class="small">${esc(M.go_live.strapi_note)}</p></div>
  <ol class="findings">${(M.go_live.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
  <h3>Strapi entries to create</h3>
  <div class="tablebox"><table>
    <thead><tr><th>Type</th><th>ID field</th><th>Name</th><th>Place</th></tr></thead>
    <tbody><tr><td>Place</td><td class="id">place_id: ${esc(M.place.place_id)}</td><td><strong>${esc(M.place.name)}</strong></td><td class="small">—</td></tr>
    ${(M.exhibitions||[]).map(e=>`<tr><td>Exhibition</td><td class="id">exhibition_id: ${esc(e.id)}</td><td><strong>${esc(e.name)}</strong><div class="small">${esc(e.floor)}</div></td><td class="id">${esc(M.place.place_id)}</td></tr>`).join("")}</tbody>
  </table></div>
  ${M.strapi_copy?`<h3>Prompt and greeting for each entry</h3><p class="small">${esc(M.strapi_copy.note)}</p>
  ${[{label:"Place",id:"place_id: "+M.strapi_copy.place.place_id,name:M.strapi_copy.place.name,c:M.strapi_copy.place},...(M.exhibitions||[]).filter(e=>M.strapi_copy.exhibitions[e.id]).map(e=>({label:e.room?"Room "+e.room:"Exhibition",id:"exhibition_id: "+e.id,name:e.name,c:M.strapi_copy.exhibitions[e.id]}))].map(x=>`<details class="copy-entry"><summary><span class="small">${esc(x.label)}</span>${esc(x.name)}<span class="id">${esc(x.id)}</span></summary>
    <div class="copy-field"><h4>Prompt <button type="button" class="copy-btn">Copy</button></h4><p class="copy-text">${esc(x.c.prompt)}</p></div>
    <div class="copy-field"><h4>Greeting <button type="button" class="copy-btn">Copy</button></h4><p class="copy-text">${esc(x.c.greeting)}</p></div></details>`).join("")}`:""}
  ${(M.go_live.mispronunciations||[]).length?`<h3>Mispronunciations to add to the Place</h3><p class="small">Names speech-to-text is likely to mishear. Add each with its common mishearings after testing.</p>${tags(M.go_live.mispronunciations)}`:""}
</section>`:""}

<section aria-labelledby="h-q"><div class="section-head"><h2 id="h-q">Open questions</h2></div>
  <ul class="plain">${(M.open_questions||[]).map(q=>`<li>${esc(q)}</li>`).join("")}</ul>
</section>

<footer>
  <div>Prepared ${esc(fmtDate(M.prepared))}, updated ${esc(fmtDate(M.updated))}. Generated from <code>manifest.json</code> (manifest version ${esc(M.manifest_version)}).</div>
  <div>These license assessments are a working view, not legal advice.</div>
</footer>`;

const order=["all",...["ingest","attrib","outreach","verify","exclude"].filter(k=>counts[k])];
let cur="all";
try{const v=localStorage.getItem("srcFilter");if(order.includes(v))cur=v}catch(_){}
const chips=document.getElementById("chips");
function renderSources(){
  document.querySelector("#src-table tbody").innerHTML=(M.sources||[]).filter(x=>cur==="all"||x.status===cur).map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="id">${esc(x.id)}</div></td><td><span class="pill s-${esc(x.status)}">${esc(LABEL[x.status]||x.status)}</span></td><td class="small">${esc(x.license)}</td><td class="small">${esc(x.scope)}</td><td>${esc(x.gives)}</td><td class="small">${esc(x.access)}${x.volume&&x.volume!=="—"?` · ${esc(x.volume)}`:""}</td><td class="checked">${esc(x.checked)}</td><td>${decision(x.decision)}</td></tr>`).join("");
  chips.innerHTML=order.map(k=>`<button class="chip" id="chip-${k}" aria-pressed="${k===cur}" data-k="${k}">${k==="all"?"All":LABEL[k]} · ${k==="all"?(M.sources||[]).length:counts[k]}</button>`).join("");
}
chips.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.k;try{localStorage.setItem("srcFilter",cur)}catch(_){}renderSources()});
renderSources();
document.addEventListener("click",ev=>{const b=ev.target.closest(".copy-btn");if(!b)return;const t=b.closest(".copy-field").querySelector(".copy-text").textContent;const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)};try{navigator.clipboard.writeText(t).then(done,()=>{})}catch(e){}});
</script>
